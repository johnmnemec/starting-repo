name: Generated ZAPP document
description: Some text here
author:
  name: IBM CORPORATION
  
propertyGroups:
  - name: cobol-copybooks
    language: cobol
    libraries:
      - name: syslib
        type: local
        locations:
          - "**"

profiles:
  - name: zBuilder-userbuild
    type: dbb
    settings:
      command: "$DBB_HOME/bin/dbb build"
      lifecycle: user
      lifecycleArgs:
        - " --hlq ${zopeneditor.userbuild.userSettings.dbbHlq}"
      additionalDependencies:
        - "dbb-app.yaml"
      logFilePatterns:
        - "hello-world/logs/**"
  - name: dbb-build
    type: dbb
    settings:
        application: application
        command: $DBB_HOME/bin/groovyz
        buildScriptPath: $HOME/zAppBuild/build.groovy
        buildScriptArgs:
          - --userBuild
          - --workspace ${zopeneditor.userbuild.userSettings.dbbWorkspace}
          - --application ${application}
          - --hlq ${zopeneditor.userbuild.userSettings.dbbHlq}
          - --outDir ${zopeneditor.userbuild.userSettings.dbbLogDir}
          - --dependencyFile ${dependencyFile}
        additionalDependencies:
          - application-conf
        logFilePatterns:
          - ${buildFile.basename}.log
          - BuildReport.*
    

